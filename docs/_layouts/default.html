<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">

<head>
    <!---<base target="_blank"> --->
    <meta http-equiv="refresh" content="60000">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
<style>
html,
body {

		color: rgb(255, 255, 255);
		background-color: rgb(1, 1, 1);
		font-size: 1em;
        margin: 0;
        padding: 0;
}

a,
a.visited {
	color: inherit;
	text-decoration: none;
}

table, tr, th ,td ,tr:nth-child(even),tr:nth-child(odd){
	color: rgb(255, 255, 255);
	background-color: rgb(1, 1, 1);
	text-decoration: none;
}
	
.mono { font-family: monospace, monospace, monospace; }
</style>

  <style>
    .container {
      display: grid;
      place-items: end; /* 將內容置於右下角 */
      height: 100vh; /* 容器高度為視窗高度 */
      width: 100%;
    }
    .container a {
      background-color: #007bff; /* 背景色 */
      color: white; /* 文字顏色 */
      padding: 10px 20px; /* 內邊距 */
      text-decoration: none; /* 移除下劃線 */
      border-radius: 5px; /* 圓角 */
    }
    .container a:hover {
      background-color: #0056b3; /* 滑鼠懸停時的背景色 */
    }
  </style>
	
	<title>{% if page.title %}{{ page.title }}{% else %}{{ page.name }}{% endif %}</title>
	
</head>

<body>
	
  	<div class="container-fluid px-3 my-5 markdown-body">
	  {{ content }}
  	</div>

	<div class="container">
  		<a href="/go">Home</a>
	</div>
	
</body>
</html>
